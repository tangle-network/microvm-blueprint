[workspace]
members = [
  "microvm-blueprint-lib",
  "microvm-blueprint-bin",
]
resolver = "2"

[workspace.dependencies]
blueprint-sdk = { git = "https://github.com/tangle-network/blueprint", rev = "be8bd303260d3b1e1df6624eeac92b3ce1f40c38", package = "blueprint-sdk", default-features = false }
microvm-runtime = { version = "0.1.0-alpha.1", default-features = false }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
